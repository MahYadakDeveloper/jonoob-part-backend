packages:
  - app/*
  - feature/*/**
  - infrastructure/*/**
  - packages/*

catalog:
  typescript: ^6.0.3
  "@nestjs/common": 12.0.3
  "@nestjs/core": 12.0.3
  "@nestjs/config": ^12.0.0
  "@nestjs/platform-fastify": ^12.0.3
  rxjs: 7.8.1
  fastify: 5.12.5
  "@fastify/multipart": 10.1.1
  zod: ^4.6.5
  "@casl/ability": ^7.0.1
  pg: ^8.23.0
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  dotenv: ^17.4.2
  "@nestjs/cli": ^12.0.3
  "@nestjs/schedule": ^12.0.2
  "@nestjs/drizzle": ^0.0.1
  "@nestjs/outbox": ^0.0.1
  bullmq: ^6.3.9
  "@nestjs/bullmq": ^12.0.0
  "@fastify/formbody": ^9.0.0
  redis: ^6.3.0
  "@nestjs/jwt": ^12.0.2
  "@nestjs/axios": ^12.0.1
  axios: ^1.20.0
  ioredis: ^6.0.0
  redlock: 5.0.0-beta.2

overrides:
  fastify: "catalog:"

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  workerd: true

# httpsProxy: "http://192.168.1.10:18888"
# httpProxy: "http://192.168.1.10:18888"

fetchTimeout: 90000

minimumReleaseAgeExclude:
  - "@jonoob-part/contracts@1.0.0 || 1.0.1 || 1.0.2"

# registries:
#   default: https://package-mirror.liara.ir/repository/npm/

# strictSsl: false
